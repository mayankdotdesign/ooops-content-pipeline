name: Daily Ooops Post

on:
  # No `schedule:` trigger here (2026-09-17) -- GitHub's own cron
  # silently dropped one of the two daily slots the one time this ran
  # with it (see docs/build-plan.md), and for THIS workflow specifically
  # a dropped-then-doubled-up firing is worse than just "late": if
  # GitHub's schedule and an external trigger both fired near the same
  # time, two concurrent runs could each independently pick the SAME
  # "next queued item" and post it to Instagram twice -- a real
  # duplicate live post, not just a wasted run. An external cron
  # (cron-job.org, "0 23,1 * * *" UTC = 7pm/9pm ET) POSTs to this
  # workflow's dispatch endpoint instead. workflow_dispatch stays for
  # manual testing. The concurrency group below is a second, independent
  # safety net against that same double-post scenario regardless of
  # what triggered the extra run.
  workflow_dispatch:
    inputs:
      force:
        description: "Post now even outside the scheduled 23:00/03:00 UTC windows"
        type: boolean
        default: false

concurrency:
  group: daily-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pillow requests

      - name: Find next queued post
        id: find
        run: |
          # 2026-09-25 guard: a cron-job.org "Test Run" (or a manual
          # dispatch) posts for real -- post 28 went out at 09:02 UTC that
          # way, breaking its slot-controlled test. Only post within 15
          # min of a scheduled slot (23:00 / 03:00 UTC) unless run from
          # GitHub with force=true. cron-job.org sends no inputs, so
          # force is false for it.
          FORCE="${{ inputs.force }}"
          IN_WINDOW=$(python -c "
          import datetime
          n = datetime.datetime.now(datetime.timezone.utc)
          m = n.hour * 60 + n.minute
          print('yes' if any(abs(m - s) <= 15 for s in (23 * 60, 3 * 60)) else 'no')
          ")
          if [ "$FORCE" != "true" ] && [ "$IN_WINDOW" != "yes" ]; then
            echo "Outside the 23:00/03:00 UTC posting windows and force is not set -- not posting."
            echo "queue_id=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          NEXT_ID=$(python -c "
          import json
          with open('content_queue/queue.json') as f:
              q = json.load(f)
          # 2026-09-25: Reels only -- a queued item with no rendered
          # content_queue/rendered/<id>.mp4 is skipped (held), never
          # posted as a static image. Order in queue.json is the posting
          # order, so a held item doesn't block the ones behind it.
          import os
          nxt = next((i for i in q if i['stage'] == 'queued'
                      and os.path.isfile(f\"content_queue/rendered/{i['id']}.mp4\")), None)
          print(nxt['id'] if nxt else '')
          ")
          echo "queue_id=$NEXT_ID" >> "$GITHUB_OUTPUT"

      # NOTE: no render step here. Per Phase 6 (docs/queue-schema.md,
      # "Where rendering actually happens"), images are rendered and
      # committed during the visual-approval cycle, well before an item
      # reaches stage "queued" — this job only posts what's already
      # rendered and already live on raw.githubusercontent.com. The old
      # "render, commit, sleep 8" sequence doesn't apply here: that sleep
      # existed to let a *freshly pushed* image propagate before Instagram
      # fetched it same-request, which isn't a factor when the image has
      # already been sitting on GitHub for however long review took.

      - name: Post to Instagram
        if: steps.find.outputs.queue_id != ''
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_ACCOUNT_ID: ${{ secrets.IG_ACCOUNT_ID }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/post_to_instagram.py "${{ steps.find.outputs.queue_id }}"

      - name: Commit updated queue.json
        if: steps.find.outputs.queue_id != ''
        run: |
          # 2026-09-20: review-cycle.yml and track-engagement.yml also
          # commit+push to content_queue/ independently -- see
          # review-cycle.yml's commit step for the full explanation of why
          # a bare `git push` here can get rejected by a concurrent run of
          # one of those, even though this job made a real local commit.
          git config user.name "ooops-bot"
          git config user.email "bot@ooopsapp.com"
          git add content_queue/queue.json
          git commit -m "Mark post ${{ steps.find.outputs.queue_id }} as posted" || echo "nothing to commit"
          for i in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt $i) -- another workflow pushed first. Rebasing onto origin/main and retrying."
            git fetch origin main
            git rebase origin/main
          done
          echo "Push still failing after 5 attempts -- giving up."
          exit 1
