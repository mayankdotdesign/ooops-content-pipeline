name: Daily Ooops Post

on:
  schedule:
    - cron: "30 7 * * *"
  workflow_dispatch: {}

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pillow requests

      - name: Find next queued post
        id: find
        run: |
          NEXT_ID=$(python -c "
          import json
          with open('content_queue/queue.json') as f:
              q = json.load(f)
          nxt = next((i for i in q if i['stage'] == 'queued'), None)
          print(nxt['id'] if nxt else '')
          ")
          echo "queue_id=$NEXT_ID" >> "$GITHUB_OUTPUT"

      # NOTE: no render step here. Per Phase 6 (docs/queue-schema.md,
      # "Where rendering actually happens"), images are rendered and
      # committed during the visual-approval cycle, well before an item
      # reaches stage "queued" — this job only posts what's already
      # rendered and already live on raw.githubusercontent.com. The old
      # "render, commit, sleep 8" sequence doesn't apply here: that sleep
      # existed to let a *freshly pushed* image propagate before Instagram
      # fetched it same-request, which isn't a factor when the image has
      # already been sitting on GitHub for however long review took.

      - name: Post to Instagram
        if: steps.find.outputs.queue_id != ''
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_ACCOUNT_ID: ${{ secrets.IG_ACCOUNT_ID }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/post_to_instagram.py "${{ steps.find.outputs.queue_id }}"

      - name: Commit updated queue.json
        if: steps.find.outputs.queue_id != ''
        run: |
          git config user.name "ooops-bot"
          git config user.email "bot@ooopsapp.com"
          git add content_queue/queue.json
          git commit -m "Mark post ${{ steps.find.outputs.queue_id }} as posted" || echo "nothing to commit"
          git push
