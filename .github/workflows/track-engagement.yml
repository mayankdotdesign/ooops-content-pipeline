name: Track Engagement

on:
  # No `schedule:` trigger (2026-09-17) -- see daily-post.yml/
  # review-cycle.yml for why: GitHub's own cron has repeatedly dropped
  # or delayed firings across this build. An external cron
  # (cron-job.org, "0 12 * * *" UTC) POSTs to this workflow's dispatch
  # endpoint instead. Lower stakes here than daily-post.yml (re-reading
  # engagement stats twice is harmless, not a duplicate live action),
  # but no reason to trust the flaky trigger anywhere once we don't
  # have to.
  workflow_dispatch: {}

concurrency:
  group: track-engagement
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Pull Instagram Insights for posted items
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python scripts/track_engagement.py

      - name: Commit performance.json if it changed
        run: |
          git config user.name "ooops-bot"
          git config user.email "bot@ooopsapp.com"
          git add content_queue/
          git commit -m "Update engagement performance data" || echo "nothing to commit"
          git push
