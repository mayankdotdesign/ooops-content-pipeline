name: Track Engagement

on:
  # No `schedule:` trigger (2026-09-17) -- see daily-post.yml/
  # review-cycle.yml for why: GitHub's own cron has repeatedly dropped
  # or delayed firings across this build. An external cron
  # (cron-job.org, "0 12 * * *" UTC) POSTs to this workflow's dispatch
  # endpoint instead. Lower stakes here than daily-post.yml (re-reading
  # engagement stats twice is harmless, not a duplicate live action),
  # but no reason to trust the flaky trigger anywhere once we don't
  # have to.
  workflow_dispatch: {}

concurrency:
  group: track-engagement
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Pull Instagram Insights for posted items
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python scripts/track_engagement.py

      - name: Commit performance.json if it changed
        run: |
          # 2026-09-20: daily-post.yml and review-cycle.yml also commit+push
          # to content_queue/ independently -- see review-cycle.yml's commit
          # step for the full explanation of why a bare `git push` here can
          # get rejected by a concurrent run of one of those.
          git config user.name "ooops-bot"
          git config user.email "bot@ooopsapp.com"
          git add content_queue/
          git commit -m "Update engagement performance data" || echo "nothing to commit"
          for i in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt $i) -- another workflow pushed first. Rebasing onto origin/main and retrying."
            git fetch origin main
            git rebase origin/main
          done
          echo "Push still failing after 5 attempts -- giving up."
          exit 1
