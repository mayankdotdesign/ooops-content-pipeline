name: Review Cycle

on:
  # No `schedule:` trigger here on purpose (2026-09-17). GitHub's own
  # cron proved unreliable across this whole build -- see
  # docs/build-plan.md's status log for the repeated real incidents
  # (dropped firings, hours of silence, one confirmed skipped slot on
  # daily-post.yml). An external cron (cron-job.org, every 15 min)
  # POSTs to this workflow's dispatch endpoint instead -- same effect
  # as a person clicking "Run workflow", just automated and actually
  # reliable. workflow_dispatch is also still there for manual testing.
  workflow_dispatch: {}

concurrency:
  group: review-cycle
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pillow requests gspread google-auth

      - name: Advance the review cycle
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ vars.GOOGLE_SHEET_ID }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/review_cycle.py

      - name: Commit queue/rendered changes
        run: |
          # 2026-09-20: this job's own concurrency group only stops it from
          # racing ITSELF -- daily-post.yml and track-engagement.yml also
          # commit+push to content_queue/ on their own schedules, with no
          # coordination between the three. `git push` validates against
          # the LIVE remote tip regardless of what this checkout believed,
          # so a run with zero local changes can still get rejected as
          # non-fast-forward if either of the other two pushed in the
          # meantime (confirmed: run #321 failed this way with "nothing to
          # commit" in its own diff). Fetch+rebase+retry instead of a bare
          # push.
          git config user.name "ooops-bot"
          git config user.email "bot@ooopsapp.com"
          git add content_queue/
          git commit -m "Advance review cycle" || echo "nothing to commit"
          for i in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt $i) -- another workflow pushed first. Rebasing onto origin/main and retrying."
            git fetch origin main
            git rebase origin/main
          done
          echo "Push still failing after 5 attempts -- giving up."
          exit 1
