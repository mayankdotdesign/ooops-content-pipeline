name: Review Cycle

on:
  # Offset from the hour/quarter-hour (:00/:15/:30/:45) on purpose --
  # GitHub explicitly documents that's peak load for Actions scheduling
  # and scheduled runs there are the most likely to be delayed or
  # dropped. Every 20 min at :07/:27/:47 avoids that contention.
  # (2026-09-17: the exact-quarter-hour version never fired once on its
  # own across 5 real runs, all manual -- see docs/build-plan.md.)
  schedule:
    - cron: "7,27,47 * * * *"
  workflow_dispatch: {}

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pillow requests gspread google-auth

      - name: Advance the review cycle
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ vars.GOOGLE_SHEET_ID }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/review_cycle.py

      - name: Commit queue/rendered changes
        run: |
          git config user.name "ooops-bot"
          git config user.email "bot@ooopsapp.com"
          git add content_queue/
          git commit -m "Advance review cycle" || echo "nothing to commit"
          git push
